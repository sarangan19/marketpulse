name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  staging:
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging

  prod:
    needs: staging
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
