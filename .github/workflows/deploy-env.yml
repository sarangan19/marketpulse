name: deploy-env

# Reusable: apply one environment, publish the SPA, run the smoke test.
# The `prod` GitHub environment should require a reviewer, which gates promotion.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: 1.16.6
  AWS_REGION: ap-south-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TF_DIR: infra/envs/${{ inputs.environment }}
      TF_VAR_ses_sender: ${{ vars.SES_SENDER }}
      TF_VAR_admin_emails: ${{ vars.ADMIN_EMAILS || '[]' }}
      TF_VAR_fail_symbols: ${{ inputs.environment == 'staging' && vars.FAIL_SYMBOLS || '' }}
    steps:
      - name: check required variables
        run: |
          missing=""
          for v in AWS_ROLE_ARN TF_STATE_BUCKET SES_SENDER; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          [ -z "$missing" ] || { echo "::error::set GitHub variables:$missing"; exit 1; }
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          SES_SENDER: ${{ vars.SES_SENDER }}
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/build_lambda.py
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform -chdir=$TF_DIR init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: apply
        run: terraform -chdir=$TF_DIR apply -input=false -auto-approve
      - id: out
        run: |
          for k in api_url user_pool_id client_id frontend_url frontend_bucket distribution_id; do
            echo "$k=$(terraform -chdir=$TF_DIR output -raw $k)" >> "$GITHUB_OUTPUT"
          done
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: build SPA
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.out.outputs.api_url }}
          VITE_USER_POOL_ID: ${{ steps.out.outputs.user_pool_id }}
          VITE_CLIENT_ID: ${{ steps.out.outputs.client_id }}
        run: npm ci && npm run build
      - name: publish SPA
        run: |
          aws s3 sync frontend/dist "s3://${{ steps.out.outputs.frontend_bucket }}" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp frontend/dist/index.html "s3://${{ steps.out.outputs.frontend_bucket }}/index.html" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ steps.out.outputs.distribution_id }}" \
            --paths "/index.html" "/"
      - name: smoke test
        run: |
          npx --yes newman@6 run postman/marketpulse.postman_collection.json --folder smoke \
            --env-var "baseUrl=${{ steps.out.outputs.api_url }}" \
            --env-var "frontendUrl=${{ steps.out.outputs.frontend_url }}"
